[package]
name = "linux-helper"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Amical native helper for Linux"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
# X11 backend: pure-Rust connection, no libX11/libxcb at run time.
x11rb = { version = "0.14", default-features = false, features = ["xinput", "xtest", "xfixes"] }
# poll(2) with a timeout on the X connections and clipboard pipes; x11rb
# already depends on it.
rustix = { version = "1", default-features = false, features = ["std", "event", "fs"] }
# Wayland data-control clipboard (KDE): pure-Rust client, no libwayland.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# Signal streams for the portal clients; zbus already depends on it.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[features]
# Integration tests against a real X server (run under xvfb-run).
it-x11 = []

[dev-dependencies]
jsonschema = { version = "0.61", default-features = false }
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
panic = "unwind"
