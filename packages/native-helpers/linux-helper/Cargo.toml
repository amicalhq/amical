[package]
name = "linux-helper"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Amical native helper for Linux"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }

[dev-dependencies]
jsonschema = { version = "0.61", default-features = false }
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
panic = "unwind"
