name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check and Tests
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Fetch comparison base
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Keep aligned with .github/workflows/release.yml
          node-version: "24.1.0"

      - name: Setup pnpm
        # Runs after Node.js: pnpm 11 needs Node.js 22 or later. The version
        # comes from packageManager in package.json.
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        env:
          GGML_NATIVE: OFF
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type:check

      - name: Test desktop (including lifecycle contract)
        run: pnpm --filter @amical/desktop test

      - name: Verify lifecycle contract version
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm --filter @amical/desktop verify:lifecycle-contract-version "$BASE_SHA"

  test_linux_helper:
    name: Test Linux helper
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/native-helpers/linux-helper

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Keep aligned with .github/workflows/release.yml
          node-version: "24.1.0"

      - name: Setup pnpm
        # Runs after Node.js: pnpm 11 needs Node.js 22 or later. The version
        # comes from packageManager in package.json.
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate JSON schemas and Rust models
        working-directory: .
        run: |
          pnpm --filter @amical/types generate:json-schemas
          pnpm --filter @amical/types generate:rust

      - name: Install D-Bus and Xvfb (process and X11 tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dbus xvfb xauth

      - name: Install Rust
        # The version and components come from rust-toolchain.toml.
        run: rustup toolchain install

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native-helpers/linux-helper

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        # it-x11 only adds the X11 test target, so this also lints it.
        run: cargo clippy --all-targets --locked --features it-x11 -- -D warnings

      - name: Unit tests
        run: cargo test --locked --bins

      - name: Process tests (private session bus, temporary HOME and XDG dirs)
        run: cargo test --locked --test protocol

      - name: X11 tests (Xvfb)
        run: xvfb-run -a cargo test --locked --features it-x11 --test x11

  build_desktop:
    name: Build Desktop (${{ matrix.os }} ${{ matrix.arch }})
    needs: typecheck
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: x64
            runner: windows-2025-vs2026
          - os: windows
            arch: arm64
            runner: windows-11-vs2026-arm
          # Ubuntu 22.04 (glibc 2.35) is the oldest supported Linux, so what
          # builds here runs on every supported distribution.
          - os: linux
            arch: x64
            runner: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Keep aligned with .github/workflows/release.yml
          node-version: "24.1.0"
          architecture: ${{ matrix.arch }}

      - name: Setup pnpm
        # Runs after Node.js: pnpm 11 needs Node.js 22 or later. The version
        # comes from packageManager in package.json.
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install Linux packaging tools
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot rpm

      - name: Install Rust (Linux helper)
        if: matrix.os == 'linux'
        # The version and components come from rust-toolchain.toml.
        working-directory: packages/native-helpers/linux-helper
        run: rustup toolchain install

      - name: Install Vulkan SDK
        if: matrix.os == 'windows' && matrix.arch == 'x64'
        shell: pwsh
        env:
          VULKAN_VERSION: 1.4.363.0
        run: |
          curl.exe -fL -o "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --root "C:\VulkanSDK\$env:VULKAN_VERSION" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\Bin"

      - name: Install dependencies
        env:
          GGML_NATIVE: OFF
        run: pnpm install --frozen-lockfile

      - name: Install Electron binary
        run: pnpm --filter @amical/desktop exec install-electron

      - name: Generate native helper models
        run: pnpm --filter @amical/types generate:all

      - name: Smoke test Windows native dependencies
        if: matrix.os == 'windows'
        working-directory: apps/desktop
        run: pnpm test:native-dependencies

      - name: Test Windows helper
        if: matrix.os == 'windows'
        run: dotnet test packages/native-helpers/windows-helper-tests/WindowsHelper.Tests.csproj -c Release --arch ${{ matrix.arch }} -- RunConfiguration.TreatNoTestsAsError=true

      - name: Test Swift helper
        if: matrix.os == 'macos'
        run: swift test --package-path packages/native-helpers/swift-helper

      - name: Build whisper wrapper JS
        run: pnpm --filter @amical/whisper-wrapper build

      - name: Build whisper native binaries
        env:
          GGML_NATIVE: OFF
        run: pnpm --filter @amical/whisper-wrapper build:native

      - name: Build whisper native binaries (vulkan)
        if: matrix.os == 'windows' && matrix.arch == 'x64'
        env:
          GGML_NATIVE: OFF
        run: pnpm --filter @amical/whisper-wrapper build:native:vulkan

      - name: Smoke test whisper native binary
        run: pnpm --filter @amical/whisper-wrapper test:load

      - name: Download Node.js binaries
        working-directory: apps/desktop
        run: pnpm download-node

      - name: Package desktop app (no signing)
        if: matrix.os != 'linux'
        working-directory: apps/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          AMICAL_E2E_PACKAGE: "1"
          SKIP_CODESIGNING: "true"
          SKIP_NOTARIZATION: "true"
          TELEMETRY_ENABLED: "false"
          POSTHOG_HOST: https://app.posthog.com
          POSTHOG_API_KEY: ""
          FEEDBACK_SURVEY_ID: ""
          AUTH_CLIENT_ID: ""
          AUTHORIZATION_ENDPOINT: ""
          AUTH_TOKEN_ENDPOINT: ""
          API_ENDPOINT: ""
          AUTH_REDIRECT_URI: ""
          CORE_API_URL: ""
        run: pnpm package

      - name: Verify packaged Windows architecture
        if: matrix.os == 'windows'
        working-directory: apps/desktop
        run: pnpm verify:windows-package ${{ matrix.arch }}

      - name: Test packaged desktop app
        if: matrix.os != 'linux'
        working-directory: apps/desktop
        run: pnpm test:e2e

      - name: Make deb and rpm (no signing)
        if: matrix.os == 'linux'
        working-directory: apps/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          TELEMETRY_ENABLED: "false"
          POSTHOG_HOST: https://app.posthog.com
          POSTHOG_API_KEY: ""
          FEEDBACK_SURVEY_ID: ""
          AUTH_CLIENT_ID: ""
          AUTHORIZATION_ENDPOINT: ""
          AUTH_TOKEN_ENDPOINT: ""
          API_ENDPOINT: ""
          AUTH_REDIRECT_URI: ""
          CORE_API_URL: ""
        run: pnpm make

      - name: Verify Linux package
        if: matrix.os == 'linux'
        working-directory: apps/desktop
        run: pnpm verify:linux-package

      - name: Upload Linux packages
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: amical-linux-x64
          path: |
            apps/desktop/out/make/deb/x64/*.deb
            apps/desktop/out/make/rpm/x64/*.rpm
          retention-days: 14
