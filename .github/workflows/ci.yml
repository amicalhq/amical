name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Keep aligned with .github/workflows/release.yml
          node-version: "24.1.0"
          cache: pnpm

      - name: Install dependencies
        env:
          GGML_NATIVE: OFF
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type:check

      - name: Verify recording contract artifact
        run: pnpm --filter @amical/desktop test:recording-contract

      - name: Verify recording contract version
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm --filter @amical/desktop verify:recording-contract-version "$BASE_SHA"

  build_desktop:
    name: Build Desktop (${{ matrix.os }} ${{ matrix.arch }})
    needs: typecheck
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-latest
          - os: windows
            arch: x64
            runner: windows-2022
          - os: windows
            arch: arm64
            runner: windows-11-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Keep aligned with .github/workflows/release.yml
          node-version: "24.1.0"
          architecture: ${{ matrix.arch }}
          cache: pnpm

      - name: Install dependencies
        env:
          GGML_NATIVE: OFF
        run: pnpm install --frozen-lockfile

      - name: Smoke test Windows native dependencies
        if: matrix.os == 'windows'
        working-directory: apps/desktop
        run: pnpm test:native-dependencies

      - name: Test Windows helper
        if: matrix.os == 'windows'
        run: dotnet test packages/native-helpers/windows-helper-tests/WindowsHelper.Tests.csproj -c Release --arch ${{ matrix.arch }} -- RunConfiguration.TreatNoTestsAsError=true

      - name: Build whisper wrapper JS
        run: pnpm --filter @amical/whisper-wrapper build

      - name: Build whisper native binaries
        env:
          GGML_NATIVE: OFF
        run: pnpm --filter @amical/whisper-wrapper build:native

      - name: Smoke test whisper native binary
        run: pnpm --filter @amical/whisper-wrapper test:load

      - name: Download Node.js binaries
        working-directory: apps/desktop
        run: pnpm download-node

      - name: Package desktop app (no signing)
        working-directory: apps/desktop
        env:
          AMICAL_E2E_PACKAGE: "1"
          SKIP_CODESIGNING: "true"
          SKIP_NOTARIZATION: "true"
          TELEMETRY_ENABLED: "false"
          POSTHOG_HOST: https://app.posthog.com
          POSTHOG_API_KEY: ""
          FEEDBACK_SURVEY_ID: ""
          AUTH_CLIENT_ID: ""
          AUTHORIZATION_ENDPOINT: ""
          AUTH_TOKEN_ENDPOINT: ""
          API_ENDPOINT: ""
          AUTH_REDIRECT_URI: ""
          CORE_API_URL: ""
        run: pnpm package

      - name: Verify packaged Windows architecture
        if: matrix.os == 'windows'
        working-directory: apps/desktop
        run: pnpm verify:windows-package ${{ matrix.arch }}

      - name: Test packaged desktop app
        working-directory: apps/desktop
        run: pnpm test:e2e
